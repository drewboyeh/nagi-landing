<svg xmlns="http://www.w3.org/2000/svg" width="2.5in" height="1.75in" viewBox="0 0 750 525" role="img"
     aria-label="YUUKI KOME rice water cleanse front label, monochrome edition">
  <!--
    KOME (Step 1, Cleanse) - FRONT label, MONOCHROME edition.
    Trim 2.5 x 1.75 in at 300 dpi (750 x 525 px). Sized for small bottles.

    Built for a black-and-white laser on cream or natural sticker stock:
      - no background fill, the paper supplies the colour
      - pure black only, no greys/tints/opacity (a mono laser dithers
        those into visible dot patterns at this size)

    Photography prop, not a compliant retail label - no ingredient
    declaration or Responsible Person block.

    Rice-grain motif and wording follow the bottle art in product-kome.html.
  -->
  <defs>
    <style>
      .serif { font-family: "Shippori Mincho", "Hiragino Mincho ProN", Georgia, serif; }
      .sans  { font-family: "Zen Kaku Gothic New", "Helvetica Neue", Arial, sans-serif; }
      .k     { fill: #000000; }
    </style>
  </defs>

  <rect x="0" y="0" width="750" height="3" fill="#000000"/>
  <rect x="0" y="522" width="750" height="3" fill="#000000"/>

  <text x="375" y="58" text-anchor="middle" class="sans k" font-size="17" letter-spacing="9">YUUKI</text>

  <!-- rice grain, adapted from the KOME bottle art.
       The site version layers three strokes at 1.0/0.7/0.5 opacity so they
       read as depth. Opacity halftones on a mono laser, so here the two
       mirrored halves are kept at equal weight to form the grain and the
       third (lower sprout) stroke is dropped - at equal weight it closed
       against the grain and read as a figure-8. -->
  <g transform="translate(375,116) scale(1.35)" stroke="#000000" fill="none" stroke-width="1.15" stroke-linecap="round">
    <path d="M0,2 C-14,-8 -16,-22 -4,-28 C4,-32 14,-24 10,-12 C7,-4 2,0 0,2"/>
    <path d="M0,2 C14,-8 16,-22 4,-28 C-4,-32 -14,-24 -10,-12 C-7,-4 -2,0 0,2"/>
    <circle cy="10" r="3" fill="#000000" stroke="none"/>
  </g>

  <text x="375" y="250" text-anchor="middle" class="serif k"><tspan font-size="74">KOMÉ</tspan><tspan font-size="30" dx="16">コメ</tspan></text>

  <text x="375" y="296" text-anchor="middle" class="sans k" font-size="15" letter-spacing="5">RICE WATER CLEANSE</text>

  <rect x="290" y="332" width="170" height="1.3" fill="#000000"/>

  <text x="375" y="382" text-anchor="middle" class="sans k" font-size="15" letter-spacing="1">The purifying rice-water wash.</text>

  <text x="375" y="468" text-anchor="middle" class="sans k" font-size="16" letter-spacing="1">Net 8 fl oz / 227 mL</text>
</svg>
