<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart | YUUKI</title>
<meta name="description" content="Review the products you've picked from the YUUKI ritual.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@300;400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav__mark">YUUKI</a>
  <div class="nav__links">
    <a href="product-kome.html" class="nav__link">KOMÉ</a>
    <a href="product-tsubaki.html" class="nav__link">TSUBAKI</a>
    <a href="product-yuzu.html" class="nav__link">YUZU</a>
    <a href="quiz.html" class="nav__link">Find Your Routine</a>
    <a href="cart.html" class="nav__cart">Cart<span class="nav__cart-count" id="navCartCount" hidden>0</span></a>
  </div>
  <a href="index.html#waitlist" class="nav__cta">Join the Waitlist</a>
</nav>

<section class="cart-section">
  <h1>Your Cart</h1>
  <div id="cartList"></div>
  <div class="cart-summary" id="cartSummary" hidden></div>
  <div class="cart-actions" id="cartActions" hidden>
    <a href="quiz.html" class="btn--ghost">Retake Quiz</a>
  </div>
  <p class="cart-note" id="cartNote" hidden>Checkout isn't live yet — we'll email the waitlist the moment it is.</p>
</section>

<script src="cart.js"></script>
<script src="products.js"></script>
<script>
  function renderCart() {
    const cart = cartGet();
    const ids = Object.keys(cart);
    const listEl = document.getElementById('cartList');
    const summaryEl = document.getElementById('cartSummary');
    const actionsEl = document.getElementById('cartActions');
    const noteEl = document.getElementById('cartNote');
    listEl.innerHTML = '';

    if (!ids.length) {
      listEl.innerHTML = '<p class="cart-empty">Your cart is empty. <a href="quiz.html">Take the quiz</a> to find your routine, or browse <a href="product-kome.html">KOMÉ</a>, <a href="product-tsubaki.html">TSUBAKI</a>, and <a href="product-yuzu.html">YUZU</a>.</p>';
      summaryEl.hidden = true;
      actionsEl.hidden = true;
      noteEl.hidden = true;
      return;
    }

    ids.forEach(function (id) {
      const product = PRODUCTS[id];
      if (!product) return;
      const qty = cart[id];
      const row = document.createElement('div');
      row.className = 'cart-item';
      row.innerHTML =
        '<div class="cart-item__name"><span class="cart-item__step">' + product.step + '</span><a href="' + product.url + '">' + product.name + '</a>' +
          '<span class="cart-item__unit-price">' + formatPrice(product.price) + ' each</span></div>' +
        '<div class="qty-control">' +
          '<button type="button" data-action="dec" data-id="' + id + '" aria-label="Decrease quantity">−</button>' +
          '<span>' + qty + '</span>' +
          '<button type="button" data-action="inc" data-id="' + id + '" aria-label="Increase quantity">+</button>' +
        '</div>' +
        '<div class="cart-item__total">' + formatPrice(product.price * qty) + '</div>' +
        '<button type="button" class="cart-item__remove" data-action="remove" data-id="' + id + '">Remove</button>';
      listEl.appendChild(row);
    });

    const pricing = cartPricing();
    let summaryHtml = '';
    if (pricing.savings > 0) {
      summaryHtml += '<div class="cart-summary__row"><span>Subtotal</span><span>' + formatPrice(pricing.subtotal + pricing.savings) + '</span></div>';
      summaryHtml += '<div class="cart-summary__row cart-summary__row--savings"><span>Ritual Set savings</span><span>−' + formatPrice(pricing.savings) + '</span></div>';
    }
    summaryHtml += '<div class="cart-summary__row cart-summary__row--total"><span>Total</span><span>' + formatPrice(pricing.subtotal) + '</span></div>';
    summaryEl.innerHTML = summaryHtml;
    summaryEl.hidden = false;

    actionsEl.hidden = false;
    noteEl.hidden = false;
  }

  document.getElementById('cartList').addEventListener('click', function (e) {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const id = btn.dataset.id;
    const cart = cartGet();
    const current = cart[id] || 0;
    if (btn.dataset.action === 'inc') cartSetQty(id, current + 1);
    if (btn.dataset.action === 'dec') cartSetQty(id, current - 1);
    if (btn.dataset.action === 'remove') cartRemove(id);
    renderCart();
  });

  renderCart();
</script>

<footer>
  <div class="mark">YUUKI</div>
  <p class="copy">© 2026 YUUKI. A Japanese-inspired scalp ritual, reset for the modern shower.</p>
</footer>

</body>
</html>
